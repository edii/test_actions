name: "Run Publish"
description: "Runs a given publish image"
inputs:
  repo:
    description: "Repo to check out code from. Defaults to the main kodjin source repo. Set this when building connectors from forked repos."
    required: false
    default: "edii87shadow/test-anonym"
  tag:
    description: "Tag image"
    required: true
    default: ""
  docker_hub_username:
    description: "Dockerhub username"
    required: true
  docker_hub_password:
    description: "Dockerhub password"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout main repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0

    - name: Docker login
      uses: docker/login-action@v2
      with:
        username: ${{ inputs.docker_hub_username }}
        password: ${{ inputs.docker_hub_password }}

    - name: Publish
      env:
        DOCKER_HUB_USERNAME: ${{ inputs.docker_hub_username }}
        DOCKER_HUB_PASSWORD: ${{ inputs.docker_hub_password }}
        TZ: UTC
      shell: bash
      run: |-
        if [[ ${{ inputs.tag }} == '' ]]; then
          echo "!!! TAG is empty"
          exit 1
        fi
        
        echo "ERRORRR!!"
        exit 1

#        sh ./scripts/manage.sh publish . ${{ inputs.repo }} ${{ inputs.tag }}
